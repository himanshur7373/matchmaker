<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MatchMaker</title>
<style>
:root{--bg:#fff7f9;--card:#fff;--tx:#2b2330;--mut:#7a6f80;--pri:#e8436e;--bd:#f0dfe5}
@media(prefers-color-scheme:dark){:root{--bg:#1c161e;--card:#281f2b;--tx:#f3eaf4;--mut:#a99bb0;--bd:#3a2f3e}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--pri);color:#fff}
main{max-width:860px;margin:20px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
input,select,textarea{width:100%;padding:9px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit}
button.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.tabs button{margin-right:6px}.mut{color:var(--mut);font-size:.9em}.err{color:#d33}.score{float:right;font-weight:700;color:var(--pri)}
.chat{height:260px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:8px}
.b{padding:6px 10px;border-radius:10px;margin:4px 0;max-width:75%;background:var(--bd)}.b.me{background:var(--pri);color:#fff;margin-left:auto}
#qr{display:flex;justify-content:center;margin:12px 0;background:#fff;padding:10px;border-radius:8px;width:fit-content;margin-inline:auto}
</style></head><body>
<header><b>💘 MatchMaker</b><span id="nav"></span></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s), v=id=>document.getElementById(id).value;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,d){const o=d?{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(d)}:{};return (await fetch('/api/'+p,o)).json()}
const msg=(t)=>{const e=$('#msg');if(e)e.textContent=t};
let me=null,timer=null;

async function init(){
  clearInterval(timer);me=await api('me');
  $('#nav').innerHTML=me.ok?`${E(me.name)} <button class="alt" style="color:#fff;border-color:#fff" onclick="logout()">Logout</button>`:'';
  if(!me.ok)return authView();
  appView();
}
async function logout(){await api('logout',{});init()}

function authView(){ $('#app').innerHTML=`
<div class="row"><div class="card"><h3>Register (free)</h3>
<input id="n" placeholder="Full name"><input id="e" placeholder="Email" type="email"><input id="p" placeholder="Password (min 6)" type="password">
<div class="row"><input id="a" type="number" min="18" max="80" placeholder="Age (18+)"><select id="g"><option value="">Gender</option><option value="M">Male</option><option value="F">Female</option><option value="O">Other</option></select></div>
<input id="c" placeholder="City"><input id="i" placeholder="Interests (comma separated: music, travel, cricket)">
<textarea id="b" rows="2" placeholder="Short bio"></textarea>
<label class="mut"><input type="checkbox" id="t" style="width:auto"> I am 18+ and accept the terms</label><br><br>
<button onclick="reg()">Register</button></div>
<div class="card"><h3>Login</h3><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="lg()">Login</button></div></div>
<p id="msg" class="err"></p>`}
async function reg(){
  if(!$('#t').checked)return msg('Please accept the terms');
  const r=await api('register',{name:v('n'),email:v('e'),password:v('p'),age:v('a'),gender:v('g'),city:v('c'),interests:v('i'),bio:v('b')});
  r.ok?init():msg(r.error)}
async function lg(){const r=await api('login',{email:v('le'),password:v('lp')});r.ok?init():msg(r.error)}

function appView(){ $('#app').innerHTML=`<div class="tabs"><button onclick="discover()">Discover</button><button onclick="matches()">Matches &amp; Chat</button></div><br><div id="main"></div>`;discover()}
async function discover(){clearInterval(timer);
  $('#main').innerHTML=`<div class="card"><div class="row"><input id="fc" placeholder="City"><input id="fi" placeholder="Interest"><input id="f1" type="number" placeholder="Min age"><input id="f2" type="number" placeholder="Max age"><button onclick="loadUsers()">Search</button></div></div><div id="list"></div>`;loadUsers()}
async function loadUsers(){
  const r=await api(`browse?city=${encodeURIComponent(v('fc'))}&interest=${encodeURIComponent(v('fi'))}&min=${v('f1')}&max=${v('f2')}`);
  $('#list').innerHTML=r.users.length?r.users.map(u=>`<div class="card"><span class="score">${u.score}% match</span><b>${E(u.name)}</b>, ${u.age} <span class="mut">· ${E(u.city)}</span>
  <p>${E(u.bio)}</p><p class="mut">${E(u.interests)}</p><button id="l${u.id}" ${u.liked?'disabled':''} onclick="like(${u.id})">${u.liked?'Liked ✓':'♥ Like'}</button></div>`).join(''):'<p class="mut">No profiles found yet.</p>'}
async function like(id){const r=await api('like',{to:id});const b=$('#l'+id);b.disabled=true;b.textContent='Liked ✓';if(r.match)alert("It's a match! 🎉 Open Matches & Chat.")}
async function matches(){clearInterval(timer);const r=await api('matches');
  $('#main').innerHTML=r.matches.length?r.matches.map(m=>`<div class="card"><b>${E(m.name)}</b>, ${m.age} <span class="mut">· ${E(m.city)}</span> <button style="float:right" onclick="chat(${m.id},'${E(m.name).replace(/'/g,'')}')">Chat</button></div>`).join(''):'<p class="mut">No matches yet. Like profiles; when they like you back, they appear here.</p>'}
async function chat(id,name){
  $('#main').innerHTML=`<div class="card"><h3>Chat with ${E(name)}</h3><div class="chat" id="ch"></div><div class="row"><input id="tx" maxlength="500" placeholder="Type a message"><button style="flex:0" onclick="send(${id})">Send</button></div><button class="alt" onclick="matches()">← Back</button></div>`;
  const load=async()=>{const r=await api('messages?with='+id);if(!r.ok)return;const c=$('#ch');if(!c)return;c.innerHTML=r.messages.map(m=>`<div class="b ${m.mine?'me':''}">${E(m.text)}</div>`).join('');c.scrollTop=c.scrollHeight};
  await load();clearInterval(timer);timer=setInterval(load,4000);window._reload=load}
async function send(id){const t=v('tx').trim();if(!t)return;await api('message',{to:id,text:t});$('#tx').value='';window._reload()}

init();
</script></body></html>
